name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-lint:
    name: Security & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify Lockfile Synchronization
        run: uv lock --check

      - name: Install Dependencies
        run: uv sync --dev

      - name: Run Ruff Linting
        run: uv run ruff check .

      - name: Run Ruff Formatting Check
        run: uv run ruff format --check .

      - name: Run Package Security Vulnerability Audit
        run: uv run pip-audit

      - name: Generate and Validate CycloneDX SBOM
        run: uv run cyclonedx-py environment --pyproject pyproject.toml .venv -o sbom.json --validate

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json
          if-no-files-found: error

  unit-tests:
    name: Unit Tests (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [security-and-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: uv run pytest --verbose

